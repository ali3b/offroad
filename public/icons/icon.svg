<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" shape-rendering="crispEdges">
  <!-- Off Road app icon: our pixel pickup on stadium dirt under a chequered strip (32x32 grid, our own art). -->
  <rect width="32" height="32" fill="#0c2f4a"/>
  <rect y="0" width="32" height="3" fill="#1b1b22"/>
  <g fill="#f2f2f2"><rect x="0" y="0" width="2" height="1"/><rect x="4" y="0" width="2" height="1"/><rect x="8" y="0" width="2" height="1"/><rect x="12" y="0" width="2" height="1"/><rect x="16" y="0" width="2" height="1"/><rect x="20" y="0" width="2" height="1"/><rect x="24" y="0" width="2" height="1"/><rect x="28" y="0" width="2" height="1"/>
  <rect x="2" y="1" width="2" height="1"/><rect x="6" y="1" width="2" height="1"/><rect x="10" y="1" width="2" height="1"/><rect x="14" y="1" width="2" height="1"/><rect x="18" y="1" width="2" height="1"/><rect x="22" y="1" width="2" height="1"/><rect x="26" y="1" width="2" height="1"/><rect x="30" y="1" width="2" height="1"/>
  <rect x="0" y="2" width="2" height="1"/><rect x="4" y="2" width="2" height="1"/><rect x="8" y="2" width="2" height="1"/><rect x="12" y="2" width="2" height="1"/><rect x="16" y="2" width="2" height="1"/><rect x="20" y="2" width="2" height="1"/><rect x="24" y="2" width="2" height="1"/><rect x="28" y="2" width="2" height="1"/></g>
  <!-- "OR" in the logo's yellow with a hard orange/black extrusion -->
  <defs><g id="or">
    <rect x="4" y="5" width="9" height="2"/><rect x="4" y="5" width="2" height="10"/><rect x="11" y="5" width="2" height="10"/><rect x="4" y="13" width="9" height="2"/>
    <rect x="16" y="5" width="8" height="2"/><rect x="16" y="5" width="2" height="10"/><rect x="23" y="6" width="2" height="4"/><rect x="16" y="9" width="8" height="2"/><rect x="22" y="5" width="2" height="1"/>
    <rect x="20" y="11" width="3" height="2"/><rect x="22" y="13" width="3" height="2"/>
  </g></defs>
  <use href="#or" x="2" y="2" fill="#000"/>
  <use href="#or" x="1" y="1" fill="#a8420c"/>
  <use href="#or" fill="#ffd23a"/>
  <g fill="#fff6b0"><rect x="4" y="5" width="9" height="1"/><rect x="16" y="5" width="8" height="1"/></g>
  <!-- dirt -->
  <rect y="24" width="32" height="8" fill="#b8742c"/><rect y="24" width="32" height="1" fill="#d89a4a"/>
  <g fill="#8a5420"><rect x="3" y="28" width="3" height="1"/><rect x="14" y="30" width="4" height="1"/><rect x="25" y="27" width="3" height="1"/></g>
  <!-- the truck -->
  <rect x="5" y="19" width="22" height="4" fill="#d42a26" stroke="#000" stroke-width=".5"/>
  <rect x="12" y="16" width="8" height="4" fill="#d42a26" stroke="#000" stroke-width=".5"/>
  <rect x="13" y="17" width="6" height="2" fill="#9fc4d8"/>
  <rect x="21" y="15" width="1" height="4" fill="#222"/><rect x="21" y="15" width="5" height="1" fill="#222"/>
  <rect x="4" y="20" width="2" height="2" fill="#ffe14a"/>
  <rect x="7" y="22" width="5" height="5" fill="#1b1b1b"/><rect x="9" y="24" width="1" height="1" fill="#bbb"/>
  <rect x="20" y="22" width="5" height="5" fill="#1b1b1b"/><rect x="22" y="24" width="1" height="1" fill="#bbb"/>
  <g fill="#e9e4d4" opacity=".8"><rect x="1" y="25" width="3" height="1"/><rect x="0" y="23" width="2" height="1"/></g>
</svg>
